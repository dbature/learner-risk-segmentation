name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests flows scripts dashboard monitoring
      - name: Data rule gates, stage tests and pipeline tests
        run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the pipeline image
        run: docker build -t learner-risk-pipeline .
      - name: Run the full test suite inside the image
        run: docker run --rm learner-risk-pipeline pytest -q
  model-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the model image
        run: docker build -f Dockerfile.model -t learner-risk-model .
      - name: Run the full test suite inside the model image
        run: docker run --rm learner-risk-model pytest -q
  dashboard:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exactly what Streamlit Community Cloud installs (both apps)
        run: pip install -r dashboard/requirements.txt -r monitoring/requirements.txt pytest==8.2.2
      - name: Every dashboard and monitoring view renders, and its numbers match the reports
        run: >-
          pytest -q tests/test_dashboard_app.py tests/test_dashboard_data.py tests/test_segments.py
          tests/test_caseload.py tests/test_monitoring_app.py
  compose:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate the multi-container setup
        run: docker compose --profile batch config -q
      - name: Build and start the API from the same Dockerfile the hosted copy uses
        run: |
          docker compose build api
          docker compose up -d api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
      - name: Smoke test /predict and the explanation store
        run: |
          id=$(curl -sf -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d @tests/fixtures/learner_a.json | python -c "import json,sys; r=json.load(sys.stdin); assert abs(r['risk_score']-0.8961)<1e-4, r; print(r['explanation_id'])")
          curl -sf localhost:8000/explanations/$id > /dev/null
      - name: Stop
        if: always()
        run: docker compose down
  deploy-api:
    # Continuous deployment: only from main, only after every check has passed.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test, docker, model-docker, dashboard, compose]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the API on Render through its deploy hook (skipped when the secret is not set)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then echo "RENDER_DEPLOY_HOOK not set; skipping deployment"; exit 0; fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render deploy triggered for the commit that passed every check"
