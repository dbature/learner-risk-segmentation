name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests flows
      - name: Data rule gates, stage tests and pipeline tests
        run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the pipeline image
        run: docker build -t learner-risk-pipeline .
      - name: Run the full test suite inside the image
        run: docker run --rm learner-risk-pipeline pytest -q
