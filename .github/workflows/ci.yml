name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests flows scripts dashboard
      - name: Data rule gates, stage tests and pipeline tests
        run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the pipeline image
        run: docker build -t learner-risk-pipeline .
      - name: Run the full test suite inside the image
        run: docker run --rm learner-risk-pipeline pytest -q
  model-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the model image
        run: docker build -f Dockerfile.model -t learner-risk-model .
      - name: Run the full test suite inside the model image
        run: docker run --rm learner-risk-model pytest -q
  dashboard:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exactly what Streamlit Community Cloud installs
        run: pip install -r dashboard/requirements.txt pytest==8.2.2
      - name: Every dashboard view renders, and its numbers match the reports
        run: pytest -q tests/test_dashboard_app.py tests/test_dashboard_data.py tests/test_segments.py tests/test_caseload.py
