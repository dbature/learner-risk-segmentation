seed: 42
early_window_days: 30
target: label_non_completion   # Module 4: beat withdrawal-only by 0.074 AUC (rule: >= 0.03); src/models/target_check.py
split:
  group_key: learner_key
  test_size: 0.2
  time_aware_test: 2014J
model:
  capacity: 0.25            # share of a cohort a coach can work; sets the operating threshold
  search_scoring: average_precision
  cv_folds: 5
fairness:
  sensitive_features: [gender, age_band, disability, imd_band]   # sex and age added in Module 4
  max_recall_gap: 0.05
  min_positives_gated: 100
  many_level_rule: chi-square p >= 0.05 (pending Ethics Committee ratification)

# Module 3: data pipeline
validation:
  expected_registrations: 32593
  model_ready_min_rows: 27000
  model_ready_max_rows: 27466
bias:
  attributes: [imd_band, disability, gender, age_band, highest_education]
  min_group_size: 300
  min_retention_ratio: 0.8
  fail_on_flag: false
privacy:
  k_anonymity_threshold: 5
